services:
  client:
    image: fystack/checkmate-client:local
    build:
      context: ../..
      dockerfile: docker/dist/client.Dockerfile
    restart: always
    env_file:
      - .env.client
    ports:
      - "127.0.0.1:2345:80"
    depends_on:
      - server
  server:
    image: ghcr.io/bluewave-labs/checkmate-backend:latest
    restart: always
    expose:
      - "52345"
    depends_on:
      - mongodb
    env_file:
      - .env.server
    # volumes:
    # - /var/run/docker.sock:/var/run/docker.sock:ro
  mongodb:
    image: ghcr.io/bluewave-labs/checkmate-mongo:latest
    restart: always
    volumes:
      - ./mongo/data:/data/db
    command: ["mongod", "--quiet", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
